backend:
  name: github
  repo: qiucen20/Shirone
  branch: main

media_folder: "src/assets"
public_folder: "/src/assets"

collections:
  - name: posts
    label: "文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: published, label: "发布日期", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: description, label: "简介", widget: text }
      - { name: tags, label: "标签", widget: list, required: false }
      - { name: category, label: "分类", widget: string, required: false }
      - { name: series, label: "系列", widget: string, required: false }
      - { name: seriesOrder, label: "系列顺序", widget: number, required: false, value_type: int }
      - { name: draft, label: "草稿", widget: boolean, default: false }
      - { name: body, label: "正文", widget: markdown }

  - name: moments
    label: "动态"
    folder: "src/content/moments"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: published, label: "发布时间", widget: datetime }
      - { name: pinned, label: "置顶", widget: boolean, required: false, default: false }
      - { name: mood, label: "心情图标", widget: string, required: false, hint: "如 material-symbols:sentiment-excited-outline-rounded" }
      - { name: tags, label: "标签", widget: list, required: false }
      - name: images
        label: "图片"
        widget: list
        required: false
        fields:
          - { name: src, label: "图片路径", widget: string }
          - { name: alt, label: "图片描述", widget: string, required: false }
      - { name: body, label: "内容", widget: markdown }

  - name: albums
    label: "相册"
    folder: "public/images/albums"
    create: true
    extension: "json"
    format: "json"
    nested:
      depth: 2
      subfolders: true
    meta:
      path:
        index_file: info
    media_folder: ""
    public_folder: ""
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: description, label: "描述", widget: text, required: false }
      - { name: date, label: "日期", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: location, label: "地点", widget: string, required: false }
      - { name: tags, label: "标签", widget: list, required: false }
      - { name: layout, label: "布局", widget: select, options: ["masonry", "grid"], default: "masonry" }
      - name: columns
        label: "列数"
        widget: select
        default: 3
        options:
          - { label: "2 列", value: 2 }
          - { label: "3 列", value: 3 }
          - { label: "4 列", value: 4 }
      - { name: hidden, label: "隐藏", widget: boolean, default: false }
      - { name: password, label: "密码(可选)", widget: string, required: false }
      - { name: passwordHint, label: "密码提示", widget: string, required: false }

  - name: anime
    label: "番剧"
    files:
      - name: anime-list
        label: "番剧列表"
        file: "src/data/anime.json"
        media_folder: "/public/assets/anime"
        public_folder: "/assets/anime"
        fields:
          - name: items
            label: "条目"
            widget: list
            fields:
              - { name: title, label: "标题", widget: string }
              - { name: cover, label: "封面图", widget: image, required: false }
              - { name: link, label: "链接", widget: string, required: false }
              - { name: status, label: "状态", widget: select, options: ["watching", "completed", "planned", "onHold", "dropped"], default: "planned" }
              - { name: rating, label: "评分(0-10)", widget: number, value_type: float, min: 0, max: 10, required: false }
              - name: progress
                label: "进度"
                widget: object
                required: false
                fields:
                  - { name: watched, label: "已看集数", widget: number, value_type: int, default: 0 }
                  - { name: total, label: "总集数", widget: number, value_type: int, default: 12 }
              - { name: description, label: "一句话感想", widget: text, required: false }
              - { name: year, label: "年份", widget: string }
              - { name: studio, label: "制作公司", widget: string, required: false }
              - { name: genres, label: "题材标签", widget: list, required: false }
              - name: period
                label: "观看时间段"
                widget: object
                required: false
                fields:
                  - { name: start, label: "开始(年-月)", widget: string, required: false }
                  - { name: end, label: "结束(年-月)", widget: string, required: false }
